<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat-ling Gun Banner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.banner {
  position: relative;
  width: 520px;
  max-width: 100%;
  height: 130px;
  background: #f5f0e8;
  border: 3px solid #111;
  box-shadow: 5px 6px 0 #111;
  cursor: pointer;
  overflow: hidden;
  text-decoration: none;
  display: block;
  transition: transform 0.08s, box-shadow 0.08s;
}

.banner:hover {
  transform: translate(-2px, -2px);
  box-shadow: 7px 8px 0 #111;
}
.banner:active {
  transform: translate(2px, 2px);
  box-shadow: 3px 4px 0 #111;
}

/* Halftone texture */
.banner::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(0,0,0,0.04) 1px, transparent 1px);
  background-size: 8px 8px;
  z-index: 1;
  pointer-events: none;
}

/* Scrolling city silhouette */
.cityscape {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 200%;
  height: 55px;
  z-index: 0;
  animation: scrollCity 12s linear infinite;
}

@keyframes scrollCity {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.banner:hover .cityscape {
  animation-duration: 5s;
}

/* Road */
.road {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 16px;
  background: #b8b2a6;
  border-top: 1.5px solid #888;
  z-index: 2;
  overflow: hidden;
}

.road-dashes {
  position: absolute;
  top: 50%;
  left: 0;
  width: 200%;
  height: 2px;
  background: repeating-linear-gradient(
    to right,
    rgba(255,255,255,0.5) 0px,
    rgba(255,255,255,0.5) 18px,
    transparent 18px,
    transparent 32px
  );
  animation: scrollRoad 1.5s linear infinite;
  transform: translateY(-50%);
}

@keyframes scrollRoad {
  from { transform: translateX(0) translateY(-50%); }
  to { transform: translateX(-32px) translateY(-50%); }
}

/* HAKU — left side, fires periodically */
.haku {
  position: absolute;
  left: -4px;
  bottom: 14px;
  width: 88px;
  height: auto;
  z-index: 4;
  animation: hakuBob 2s ease-in-out infinite;
  transform-origin: center bottom;
}

@keyframes hakuBob {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* PEW bullets */
.bullet {
  position: absolute;
  z-index: 5;
  font-family: 'Bangers', cursive;
  font-size: 11px;
  color: #111;
  background: #f5f0e8;
  border: 1.5px solid #111;
  border-radius: 10px;
  padding: 1px 6px;
  animation: shootBullet 0.9s linear infinite;
  opacity: 0;
}
.bullet:nth-child(1) { bottom: 52px; left: 82px; animation-delay: 0s; }
.bullet:nth-child(2) { bottom: 44px; left: 82px; animation-delay: 0.45s; }

@keyframes shootBullet {
  0%   { opacity: 0; transform: translateX(0); }
  8%   { opacity: 1; }
  90%  { opacity: 1; transform: translateX(320px); }
  100% { opacity: 0; transform: translateX(340px); }
}

/* Casing ejection */
.casing {
  position: absolute;
  width: 6px;
  height: 10px;
  background: linear-gradient(to right, #c8a04a, #f0c060, #a07830);
  border: 1px solid #7a5820;
  border-radius: 2px;
  z-index: 5;
  animation: ejectCasing 0.9s ease-out infinite;
  opacity: 0;
}
.casing:nth-child(3) { bottom: 46px; left: 26px; animation-delay: 0.05s; }
.casing:nth-child(4) { bottom: 46px; left: 26px; animation-delay: 0.5s; }

@keyframes ejectCasing {
  0%   { opacity:0; transform: translate(0,0) rotate(0deg); }
  5%   { opacity:1; }
  100% { opacity:0; transform: translate(-12px, 32px) rotate(180deg); }
}

/* MOO — right side, bobs and charges on hover */
.moo-wrap {
  position: absolute;
  right: -8px;
  bottom: 14px;
  z-index: 4;
  width: 100px;
  height: 104px;
}

.moo-idle {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  animation: mooBob 2.2s ease-in-out infinite;
  transition: opacity 0.1s;
}

.moo-claw {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 0.1s;
}

@keyframes mooBob {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  30% { transform: translateY(-6px) rotate(-1deg); }
  70% { transform: translateY(-3px) rotate(1deg); }
}

.banner:hover .moo-idle { opacity: 0; }
.banner:hover .moo-claw { opacity: 1; }
.banner:hover .moo-wrap { animation: mooCharge 0.4s ease-in forwards; }

@keyframes mooCharge {
  0%   { transform: translateX(0); }
  40%  { transform: translateX(-18px); }
  70%  { transform: translateX(-10px); }
  100% { transform: translateX(-14px); }
}

/* Birds flying across */
.bird {
  position: absolute;
  z-index: 3;
  font-size: 18px;
  animation: flyBird linear infinite;
  opacity: 0.7;
}
.bird:nth-child(5) { top: 22px; animation-duration: 6s; animation-delay: 0s; }
.bird:nth-child(6) { top: 38px; animation-duration: 8s; animation-delay: 2.5s; }
.bird:nth-child(7) { top: 15px; animation-duration: 7s; animation-delay: 4.5s; }

@keyframes flyBird {
  from { transform: translateX(560px); opacity: 0.7; }
  5%   { opacity: 0.7; }
  95%  { opacity: 0.7; }
  to   { transform: translateX(-60px); opacity: 0; }
}

/* Text content */
.content {
  position: absolute;
  left: 96px;
  right: 108px;
  top: 0;
  bottom: 14px;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  pointer-events: none;
}

.label-top {
  font-family: 'Patrick Hand', cursive;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: #888;
  margin-bottom: 2px;
}

.title {
  font-family: 'Bangers', cursive;
  font-size: 36px;
  line-height: 1;
  color: #111;
  letter-spacing: 0.06em;
  text-shadow: 2px 3px 0 rgba(0,0,0,0.12);
  animation: titlePulse 3s ease-in-out infinite;
}

@keyframes titlePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.label-bottom {
  font-family: 'Patrick Hand', cursive;
  font-size: 10px;
  color: #666;
  letter-spacing: 0.08em;
  margin-top: 3px;
}

.play-btn {
  display: inline-block;
  margin-top: 6px;
  font-family: 'Bangers', cursive;
  font-size: 13px;
  letter-spacing: 0.1em;
  color: #111;
  background: #e8f5ee;
  border: 2px solid #111;
  padding: 3px 12px;
  box-shadow: 2px 3px 0 #111;
  transition: transform 0.08s, box-shadow 0.08s;
  animation: btnBounce 2s ease-in-out infinite;
}

@keyframes btnBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-2px); }
}

.banner:hover .play-btn {
  background: #ff69b4;
  color: white;
  border-color: #111;
}

/* Warning flash on hover */
.warning {
  position: absolute;
  top: 6px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Bangers', cursive;
  font-size: 11px;
  color: #ff1493;
  letter-spacing: 0.1em;
  z-index: 7;
  opacity: 0;
  white-space: nowrap;
  transition: opacity 0.15s;
}

.banner:hover .warning {
  opacity: 1;
  animation: warnFlash 0.4s ease-in-out infinite;
}

@keyframes warnFlash {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* PANEL label */
.panel-label {
  position: absolute;
  top: 5px;
  left: 8px;
  font-family: 'Patrick Hand', cursive;
  font-size: 8px;
  letter-spacing: 0.1em;
  color: rgba(0,0,0,0.2);
  text-transform: uppercase;
  z-index: 7;
  pointer-events: none;
}
</style>
</head>
