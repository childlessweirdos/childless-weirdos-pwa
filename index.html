<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Childless Weirdos</title>
  <link rel="icon" href="/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <header>
    <h1>Childless Weirdos</h1>
  </header>
  
  <main>
    <section id="latest-strip">
      <img src="Latest-strip.png" alt="Latest Comic Strip" />
    </section>

    <div class="buttons">
      <a href="https://www.childlessweirdos.com/archive" class="button">View Archive</a>
      <a href="https://ko-fi.com/childlessweirdos" class="button">Support on Ko-fi</a>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Childless Weirdos</p>
  </footer>

  <!-- Register the service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('/service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered with scope: ', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed: ', error);
          });
      });
    }
  </script>
</body>
</html>
